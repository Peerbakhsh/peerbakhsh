    <button onclick="sendWhatsApp()">Send Order on WhatsApp</button>

  <script>
    const myWhatsApp = "923051933595";
    function sendWhatsApp() {
      const shop = document.getElementById("shopName").value.trim();
      const owner = document.getElementById("ownerName").value.trim();
      const address = document.getElementById("shopAddress").value.trim();
      const selectedProducts = [];
      document.querySelectorAll('input[name="product"]:checked').forEach(cb => {
        selectedProducts.push(cb.value);
      });
      if(!shop || !owner || !address) { alert("Bhai pehle Dukaan ki 3 details bharein"); return; }
      if (selectedProducts.length === 0) { alert("Kam se kam 1 Product select karein"); return; }
      const message = `*WHOLESALE ORDER - All for Sukkur*%0A%0A*Dukaan:* ${shop}%0A*Owner:* ${owner}%0A*Address:* ${address}%0A%0A*Products:*%0A- ${selectedProducts.join("%0A- ")}`;
      window.open(`https://wa.me/${myWhatsApp}?text=${message}`, "_blank");
    }
  </script>
