
<!DOCTYPE html><html lang="ur"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Peerbakhsh Wholesale</title><style> *{box-sizing:border-box} body{margin:0;font-family:'Segoe UI',Arial;background:linear-gradient(135deg,#e0f7fa 0%,#f1f8e9 100%)} header{background:linear-gradient(90deg,#075e54,#25D366);color:white;text-align:center;padding:18px;font-size:23px;font-weight:bold;position:sticky;top:0}.tabs{display:flex;background:rgba(255,255,255,.8);position:sticky;top:62px;z-index:9;margin:0 10px;border-radius:15px}.tab{flex:1;padding:14px;color:#075e54;text-align:center;cursor:pointer;font-weight:bold;border-radius:15px}.tab.active{background:linear-gradient(90deg,#25D366,#075e54);color:white}.shopinfo,.product,#cartSection,#billSection,#khataSection,#adminSection{background:rgba(255,255,255,.85);margin:15px;padding:18px;border-radius:20px;box-shadow:0 4px 15px rgba(0,0,0,.1)}.product img{width:100%;height:160px;object-fit:cover;border-radius:15px}.select-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}.select-row input{width:24px;height:24px;accent-color:#25D366}.info-box{background:#fff8e1;border-left:5px solid #ff9800;padding:14px;border-radius:12px;margin:10px 0;display:none;white-space:pre-line;line-height:1.8}.row{display:flex;gap:6px}.row>*{flex:1}.cart-item{display:flex;justify-content:space-between;padding:10px;border-bottom:1px dashed #ddd}.khata-table{width:100%;border-collapse:collapse}.khata-table th{background:#075e54;color:white;padding:10px}.khata-table td{padding:8px;text-align:center;border-bottom:1px solid #ddd}.total{font-weight:bold;font-size:19px;text-align:center;background:#bbdefb;padding:14px;border-radius:12px} input,select{width:100%;padding:11px;margin:6px 0;border:2px solid #c8e6c9;border-radius:12px} button{padding:14px;border:none;border-radius:12px;color:white;font-weight:bold;cursor:pointer;width:100%;margin-top:8px}.btn-green{background:#25D366}.btn-red{background:#d32f2f}.btn-blue{background:#1976d2}.btn-gray{background:#555}.bill-header{text-align:center;border-bottom:3px dashed #075e54;padding-bottom:12px}.hidden{display:none} @media print{.tabs,header,button{display:none}} </style></head><body><header>🏪 Peerbakhsh Wholesale Order</header><div class="tabs"><div class="tab active" onclick="openTab('order')">🛒 Order</div><div class="tab" onclick="openTab('khata')">📒 Mera Khata</div><div class="tab" onclick="openTab('bill')">🧾 Bill</div><div class="tab admin-tab hidden" onclick="openTab('admin')">👑 Admin</div></div>

<div id="order">
<div class="shopinfo"><h3>Dukan Ki Maloomat</h3><input id="shopName" value="Peerbakhsh - Sukkur"><input id="shopAddress" placeholder="Dukan Ka Address"><input id="custName" placeholder="Aap Ka Naam" oninput="updateAll()"><p><b>Contact:</b> 0305-1933595</p></div>
<div class="shopinfo"><input id="search" placeholder="🔍 Product Search..." oninput="loadPage()"></div>
<div id="list"></div>
<div id="cartSection"><h3>🛒 Cart</h3><div id="cartItems">Khali Hai</div><p class="total">Total: Rs.<span id="cartTotal">0</span></p><button class="btn-gray" onclick="clearCart()">🗑️ Cart Khali Karo</button><button class="btn-green" onclick="whatsAppOrder()">📲 WhatsApp Order Bhejo</button></div>
</div>

<div id="khata" class="hidden"><div id="khataSection"><h3>📒 <span id="kNameShow">-</span> Ka Khata</h3><p class="total">Baqi: Rs.<span id="kBaqi">0</span></p><table class="khata-table"><thead><tr><th>Date</th><th>Detail</th><th>Jama</th><th>Baqi</th></tr></thead><tbody id="kHistory"></tbody></table><button class="btn-blue" onclick="window.print()">🖨️ Print</button></div></div>

<div id="bill" class="hidden"><div id="billSection"><h3>🧾 Bill Preview</h3><div id="billPrintArea"></div><button onclick="window.print()">🖨️ Print Bill</button></div></div>

<div id="admin" class="hidden"><div id="adminSection"><h3>👑 Admin Panel</h3><select id="adminCust" onchange="loadAdminKhata()"><option value="">Customer Select Karo</option></select><input id="kJama" type="number" placeholder="Jama Rqam"><button class="btn-green" onclick="addJama()">💰 Jama Add</button><hr><button class="btn-blue" onclick="saveData()">💾 Save</button><button class="btn-gray" onclick="loadData()">🔄 Reload</button><button class="btn-blue" onclick="window.print()">🖨️ Print</button><button class="btn-green" onclick="whatsAppKhata()">📲 WhatsApp Khata</button><button class="btn-red" onclick="deleteAll()">❌ Khatam</button><hr><table class="khata-table"><thead><tr><th>Date</th><th>Detail</th><th>Jama</th><th>Baqi</th></tr></thead><tbody id="adminHistory"></tbody></table><p class="total">Baqi: Rs.<span id="adminBaqi">0</span></p></div></div>

<script>
let cart=[],DATA={},IS_ADMIN=false,LAST_SAVED="";
const PRODUCTS=[{id:1,name:"Pika Nut",unit:"Paket",rate:2880,img:"https://via.placeholder.com/300x160/25D366/FFFFFF?text=Pika+Nut"},{id:2,name:"Zeera",unit:"Paket",rate:2880,img:"https://via.placeholder.com/300x160/FF9800/FFFFFF?text=Zeera"},{id:3,name:"Season",unit:"Paket",rate:2880,img:"https://via.placeholder.com/300x160/FF9800/FFFFFF?text=Season"},{id:4,name:"Magic Koko",unit:"Bundle",rate:3000,img:"https://via.placeholder.com/300x160/FF9800/FFFFFF?text=Magic+Koko"}];
if(new URLSearchParams(window.location.search).get('admin') === '1234'){IS_ADMIN = true;document.querySelector('.admin-tab').classList.remove('hidden');}

function openTab(x){document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));document.querySelectorAll('#order,#khata,#bill,#admin').forEach(d=>d.classList.add('hidden'));document.getElementById(x).classList.remove('hidden');event.target.classList.add('active');if(x=='khata')showKhata();if(x=='bill')makeBill();if(x=='admin')loadCustomers();}

function getInfo(p){let carton=18*180;let bachat=carton-p.rate;let perPacket=Math.floor(p.rate/18);return`📦 1 Carton = 18 ${p.unit}\n🧮 1 ${p.unit} = 18 Piece\n💰 1 Piece = 10 ka\n📊 1 ${p.unit} = 180 ka Maal\n🏷️ 1 Carton Me Maal = ${carton} Rs\n✅ Hamara Rate = ${p.rate} Rs\n💵 Bachat = ${bachat} Rs\n🎯 Matlab Aap Ko Mila: ${perPacket} Rs Per ${p.unit}\n🎁 Bachat: ${Math.floor(bachat/18)} Rs Per ${p.unit}`}

function loadPage(){let f=document.getElementById("search").value.toLowerCase();let html="";PRODUCTS.filter(p=>p.name.toLowerCase().includes(f)).forEach(p=>{html+=`<div class=product id=p${p.id}><div class=select-row><input type=checkbox id=check${p.id} onchange="toggle(${p.id})"><label for=check${p.id}>✅ ${p.name} Select Karo</label></div><img src="${p.img}"><h3>${p.name}</h3><div><b>Rate:</b> Rs.${p.rate} per Carton</div><div class=row><select id=name${p.id} onchange="autoAdd(${p.id})"><option>Bhindi Pulao</option><option>Rangeen Bhindi</option><option>Pathan</option></select><input id=customName${p.id} placeholder="Flavor" oninput="autoAdd(${p.id})"></div><div class=row><select id=weight${p.id} onchange="autoAdd(${p.id})"><option>5</option><option>10</option><option>20</option></select><input id=customWeight${p.id} placeholder="Weight" oninput="autoAdd(${p.id})"></div><div class=row><select id=pack${p.id} onchange="autoAdd(${p.id})"><option>Carton</option><option>${p.unit}</option></select><input id=qty${p.id} type=number value="1" oninput="autoAdd(${p.id})" placeholder="Qty"></div><div id=info${p.id} class=info-box>${getInfo(p)}</div></div>`});document.getElementById("list").innerHTML=html;}

function toggle(id){let c=document.getElementById("check"+id).checked;document.getElementById("p"+id).style.border=c?"2px solid #25D366":"";document.getElementById("info"+id).style.display=c?"block":"none";if(c)autoAdd(id); else {cart=cart.filter(x=>x.id!=id);updateAll();}}
function autoAdd(id){if(!document.getElementById("check"+id).checked)return;let q=parseInt(document.getElementById("qty"+id).value)||1;let n=document.getElementById("customName"+id).value||document.getElementById("name"+id).value;let w=document.getElementById("customWeight"+id).value||document.getElementById("weight"+id).value;let pk=document.getElementById("pack"+id).value;let p=PRODUCTS.find(x=>x.id==id);cart=cart.filter(x=>x.id!=id);cart.push({id:id,n:n,w:w,p:pk,q:q,rate:p.rate});updateAll();}
function updateAll(){updateCart(); makeBill(); saveToKhata();}
function updateCart(){let t=cart.reduce((a,b)=>a+b.rate*b.q,0);document.getElementById("cartItems").innerHTML=cart.map((x,i)=>`<div class=cart-item><span>${x.n} ${x.w} ${x.q} ${x.p}</span><span>Rs.${x.rate*x.q} <button style="width:30px" class=btn-red onclick="delItem(${i})">X</button></span></div>`).join("")||"Khali Hai";document.getElementById("cartTotal").innerText=t;}
function delItem(i){if(confirm("Delete karein?")){cart.splice(i,1);updateAll();}}
function clearCart(){if(confirm("Cart khali karein?")){cart=[];PRODUCTS.forEach(p=>{if(document.getElementById("check"+p.id))document.getElementById("check"+p.id).checked=false;document.getElementById("p"+p.id).style.border="";document.getElementById("info"+p.id).style.display="none";});updateAll();}}

function whatsAppOrder(){if(cart.length==0){alert("Pehle Cart me item add karo");return;} let cn=document.getElementById("custName").value; let sn=document.getElementById("shopName").value; let total=document.getElementById("cartTotal").innerText; let msg=`*ORDER - ${sn}*\nCustomer: ${cn}\nDate: ${new Date().toLocaleString()}\n\n`;cart.forEach(x=>{msg+=`• ${x.n} ${x.w} - ${x.q} ${x.p} = Rs.${x.rate*x.q}\n`;});msg+=`\n*Total: Rs.${total}*`;window.open(`https://wa.me/923051933595?text=${encodeURIComponent(msg)}`,'_blank');}

function makeBill(){let sn=document.getElementById("shopName").value; let sa=document.getElementById("shopAddress").value; let cn=document.getElementById("custName").value; let date=new Date().toLocaleString(); let items=cart.map(x=>`<tr><td>${x.n} ${x.w}</td><td>${x.q} ${x.p}</td><td>${x.rate}</td><td>${x.rate*x.q}</td></tr>`).join(""); let total=document.getElementById("cartTotal").innerText; document.getElementById("billPrintArea").innerHTML=`<div class=bill-header><h2>${sn}</h2><p>${sa}</p><p>Customer: ${cn}</p><p>${date}</p></div><table width=100%><tr><th>Item</th><th>Qty</th><th>Rate</th><th>Total</th></tr>${items}</table><p class=total>Total: Rs.${total}</p>`;}

function saveToKhata(){let cn=document.getElementById("custName").value; if(!cn || cart.length==0)return; let key=cn+"_"+JSON.stringify(cart); if(key==LAST_SAVED)return; LAST_SAVED=key; let total=parseInt(document.getElementById("cartTotal").innerText); if(!DATA[cn])DATA[cn]=[]; let lastBaqi=DATA[cn].length>0?DATA[cn][DATA[cn].length-1].baqi:0; DATA[cn].push({date:new Date().toLocaleString(),detail:"Order - Rs."+total,amount:total,baqi:lastBaqi+total}); saveData();}

function showKhata(){let n=document.getElementById("custName").value; document.getElementById("kNameShow").innerText=n||"-"; loadKhata(n,"kHistory","kBaqi");}
function loadAdminKhata(){let n=document.getElementById("adminCust").value; loadKhata(n,"adminHistory","adminBaqi");}
function loadKhata(n,tb,bq){let d=DATA[n]||[]; document.getElementById(tb).innerHTML=d.map(x=>`<tr><td>${x.date}</td><td>${x.detail}</td><td>${x.amount}</td><td>${x.baqi}</td></tr>`).join(""); document.getElementById(bq).innerText=d.length>0?d[d.length-1].baqi:0;}

function loadCustomers(){document.getElementById("adminCust").innerHTML='<option value="">Customer Select Karo</option>'+Object.keys(DATA).map(k=>`<option>${k}</option>`).join("")}
function addJama(){let n=document.getElementById("adminCust").value; let j=parseInt(document.getElementById("kJama").value); if(!n||!j)return; if(!DATA[n])DATA[n]=[]; let lb=DATA[n].length>0?DATA[n][DATA[n].length-1].baqi:0; DATA[n].push({date:new Date().toLocaleString(),detail:"Jama",amount:j,baqi:lb-j}); saveData(); loadAdminKhata();}
function saveData(){localStorage.setItem("khataAuto",JSON.stringify(DATA));}
function loadData(){DATA=JSON.parse(localStorage.getItem("khataAuto")||"{}");}
function deleteAll(){if(confirm("Pakka?")&&confirm("Aakhri bar?")&&confirm("Delete?")){localStorage.removeItem("khataAuto");DATA={};loadCustomers();}}
function whatsAppKhata(){let n=document.getElementById("adminCust").value; let b=document.getElementById("adminBaqi").innerText; window.open(`https://wa.me/?text=${encodeURIComponent(`Salam ${n}, Baqi: Rs.${b}`)}`)}

document.addEventListener("DOMContentLoaded",()=>{loadData();loadPage();});
</script></body></html>
