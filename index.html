<!DOCTYPE html>
<html lang="en">
<head>

  <title>All for Sukkur - Shopkeeper Order</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f5f5f5; padding: 20px; }

    input, button { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: 1px solid #ccc; font-size: 15px; }

    button:hover { background: #1ebe5b; }

  .company h3 { margin: 0 0 8px 0; color: #333; font-size: 16px; }
  .products label { display: inline-block; margin: 4px 10px 4px 0; font-size: 14px; }
  .note { text-align: center; font-weight: bold; color: #555; font-size: 13px; }
  </style>
</head>

      html += `</div>`;
      catalog.innerHTML += html;
