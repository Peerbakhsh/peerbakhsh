<script>
const myWhatsApp = "923051933595";

// Checkbox tick ho to qty wala box enable ho
document.querySelectorAll('.product-row input[type="checkbox"]').forEach(cb => {
 cb.addEventListener('change', function() {
  const qtyInput = this.parentElement.querySelector('input[type="number"]');
  qtyInput.disabled = !this.checked;
  if(this.checked && !qtyInput.value) qtyInput.value = 1;
 });
});

function sendWhatsApp() {
 const shop = document.getElementById("shopName").value.trim();
 const owner = document.getElementById("ownerName").value.trim();
 const address = document.getElementById("shopAddress").value.trim();
 
 const orderItems = [];
 document.querySelectorAll('.product-row').forEach(row => {
  const cb = row.querySelector('input[type="checkbox"]');
  const qty = row.querySelector('input[type="number"]');
  if(cb.checked) {
   const name = cb.getAttribute('data-name');
   const quantity = qty.value || 1;
   orderItems.push(`${name} x ${quantity}`);
  }
 });

 if(!shop || !owner || !address) { alert("Bhai pehle Dukaan ki 3 details bharein"); return; }
 if (orderItems.length === 0) { alert("Kam se kam 1 Product select karein aur Qty likhein"); return; }

 const message = `*WHOLESALE ORDER - All for Sukkur*%0A%0A*Dukaan:* ${shop}%0A*Owner:* ${owner}%0A*Address:* ${address}%0A%0A*Order Details:*%0A- ${orderItems.join("%0A- ")}`;
 window.open(`https://wa.me/${myWhatsApp}?text=${message}`, "_blank");
}
</script>
