/* =========================
 DEVICE SECURITY
========================= */

async function adminSecurity(){

if(!window.PublicKeyCredential){

alert(
"Is browser mein fingerprint/passkey support available nahi hai.\n"+
"Admin panel password verification ke baad khulega."
);

adminPanel();

return;

}

let supported=false;

try{

supported=
await PublicKeyCredential
.isUserVerifyingPlatformAuthenticatorAvailable();

}catch(e){

supported=false;

}

if(!supported){

alert(
"Device fingerprint/passkey available nahi hai.\n"+
"Admin panel password verification ke baad khulega."
);

adminPanel();

return;

}


/*
 First login:
 device credential create hota hai.

 Later login:
 same device credential verify hota hai.
*/

let saved=localStorage.getItem(
"peerbakhsh_admin_device"
);

if(!saved){

try{

let challenge=
crypto.getRandomValues(
new Uint8Array(32)
);

let userId=
crypto.getRandomValues(
new Uint8Array(16)
);

let credential=
await navigator.credentials.create({

publicKey:{

challenge,

rp:{
name:"Peerbakhsh All In One Wholesale"
},

user:{
id:userId,
name:ADMIN_EMAIL,
displayName:"Peerbakhsh Admin"
},

pubKeyCredParams:[
{
type:"public-key",
alg:-7
},
{
type:"public-key",
alg:-257
}
],

authenticatorSelection:{
authenticatorAttachment:"platform",
userVerification:"required",
residentKey:"preferred"
},

timeout:60000

}

});

if(!credential){

alert("Fingerprint verification cancel ho gayi.");

await signOut(auth);

return;

}

localStorage.setItem(
"peerbakhsh_admin_device",
btoa(
String.fromCharCode(
...new Uint8Array(
credential.rawId
)
)
)
);

alert(
"✅ Device fingerprint/passkey register ho gaya."
);

adminPanel();

}catch(e){

console.error(e);

alert(
"Fingerprint setup nahi hua.\n\n"+
e.message
);

await signOut(auth);

}

return;

}


/* =========================
 VERIFY EXISTING DEVICE
========================= */

try{

let challenge=
crypto.getRandomValues(
new Uint8Array(32)
);

await navigator.credentials.get({

publicKey:{

challenge,

rpId:location.hostname,

userVerification:"required",

timeout:60000

}

});

adminPanel();

}catch(e){

console.error(e);

alert(
"❌ Fingerprint / device verification failed."
);

await signOut(auth);

}

}

return snap.exists()
?snap.val()

}

function getSelectedVariant(id){

let p=
products.find(x=>x.id===id);

if(!p)return null;

let f=
document.getElementById("flavor_"+id)
?.value||"";

let w=
document.getElementById("weight_"+id)
?.value||"";

let u=
document.getElementById("unit_"+id)
?.value||"";

let fo=
(p.flavors||[])
.find(x=>x.name===f);

let wo=
(p.weights||[])
.find(x=>x.name===w);

let uo=
(p.units||[])
.find(x=>x.name===u);

let price=
Number(p.price||0);

if(fo)price=Number(fo.price);
if(wo)price=Number(wo.price);
if(uo)price=Number(uo.price);

return{
flavor:f,
weight:w,
unit:u,
price
};

}

window.getSelectedVariant=getSelectedVariant;


function updateProductRate(id){

let v=getSelectedVariant(id);

let el=
document.getElementById("rate_"+id);

if(el&&v)
el.textContent=money(v.price);

}

window.updateProductRate=updateProductRate;

function addCart(id){

products.find(x=>x.id===id);

if(!p)return;

let qty=
Number(
document.getElementById("qty"+id)
?.value
)||1;

let v=
getSelectedVariant(id);

let old=
cart.find(x=>
x.id===id &&
x.flavor===v.flavor &&
x.weight===v.weight &&
x.unit===v.unit
);

if(old){

old.qty+=qty;

}else{

cart.push({

id:p.id,
name:p.name,
icon:p.icon,
flavor:v.flavor,
weight:v.weight,
unit:v.unit,
price:v.price,
qty

});

}

openCart();

showStatus("🛒 Cart mein add ho gaya");

}

function collectRows(id){

let box=
document.getElementById(id);

let arr=[];

box?.querySelectorAll(".row")
.forEach(row=>{

let inputs=
row.querySelectorAll("input");

if(inputs.length<2)return;

let name=
inputs[0].value.trim();

let price=
Number(inputs[1].value)||0;

if(name)
arr.push({
name,
price
});

});

return arr;

}

async function saveBillEdit(id){

let b=
await dbGet("bills/"+id);

if(!b)return;

(b.items||[])
.forEach((x,i)=>{

let q=
document.getElementById("billQty"+i);

let r=
document.getElementById("billRate"+i);

if(q)x.qty=
Number(q.value)||1;

if(r)x.price=
Number(r.value)||0;

});

b.total=
(b.items||[])
.reduce(
(a,x)=>
a+
Number(x.qty)*
Number(x.price),
0
);

let payment=
Number(
document.getElementById(
"paymentAmount"
).value
)||0;

let note=
document.getElementById(
"paymentNote"
).value.trim()
||"Jama";

if(payment>0){

b.paid=
Number(b.paid||0)+payment;

if(!b.history)
b.history=[];

b.history.push({

date:
new Date()
.toLocaleString("en-PK"),

type:note,

jama:payment,

balance:
Math.max(
0,
b.total-b.paid
)

});

}

b.balance=
Math.max(
0,
b.total-b.paid
);

await dbSet(
"bills/"+id,
b
);

alert(
"✅ Bill update ho gaya.\n"+
"✅ Rate save ho gaya.\n"+
"✅ Khata update ho gaya."
);

adminBills();

}

window.saveBillEdit=saveBillEdit;

}

:

}

</small>

</button>

</div>

`;

document.getElementById("chatWindow");

if(w)
w.scrollTop=w.scrollHeight;

},100);

}

);
