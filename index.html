<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sukkur Company Products Order</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      padding: 40px;
      text-align: center;
    }
  .container {
      background: white;
      padding: 30px;
      border-radius: 12px;
      max-width: 400px;
      margin: auto;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    select, button {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 16px;
    }
    button {
      background: #25D366;
      color: white;
      border: none;
      cursor: pointer;
      font-weight: bold;
    }
    button:hover { background: #1ebe5b; }
    h2 { color: #333; }
   .note { font-size: 12px; color: red; margin-top: 10px; }
  </style>
</head>
<body>
  <div class="container">
    <h2>Sukkur Delivery Only</h2>

    <!-- 1. Company -->
    <label><b>Select Company:</b></label>
    <select id="company" onchange="showProducts()">
      <option value="">-- Choose Company --</option>
      <option value="peak">Peak Frens</option>
      <option value="cookania">Cookania</option>
    </select>

    <!-- 2. Products -->
    <label><b>Select Product:</b></label>
    <select id="products">
      <option value="">-- First Select Company --</option>
    </select>

    <!-- 3. Send Button -->
    <button onclick="sendWhatsApp()">Send Order on WhatsApp</button>

    <p class="note">* Delivery only in Sukkur City</p>
  </div>

  <script>
    // Tumhara WhatsApp number: 03051933595 → 923051933595
    const myWhatsApp = "923051933595";

    const data = {
      peak: ["Click", "Supper", "Gluko", "Mari", "Lemon", "Pinat Plus"],
      cookania: ["Peakanut", "Zeera", "Season Magic", "Coconut"]
    };

    function showProducts() {
      const company = document.getElementById("company").value;
      const productDropdown = document.getElementById("products");
      productDropdown.innerHTML = "";

      if (company && data[company]) {
        data[company].forEach(product => {
          let option = document.createElement("option");
          option.value = product;
          option.text = product;
          productDropdown.appendChild(option);
        });
      } else {
        productDropdown.innerHTML = "<option>-- First Select Company --</option>";
      }
    }

    function sendWhatsApp() {
      const companySelect = document.getElementById("company");
      const productSelect = document.getElementById("products");

      const company = companySelect.options[companySelect.selectedIndex].text;
      const product = productSelect.value;

      if (!companySelect.value ||!product) {
        alert("Pehle Company aur Product select karo");
        return;
      }

      const message = `*New Order - Sukkur*%0A%0ACompany: ${company}%0AProduct: ${product}%0A%0A*Delivery City: Sukkur*`;
      const url = `https://wa.me/${myWhatsApp}?text=${message}`;
      window.open(url, "_blank");
    }
  </script>
</body>
</html>
