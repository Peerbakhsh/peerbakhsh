<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>All for Sukkur - Order</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      padding: 40px;
      text-align: center;
    }
 .container {
      background: white;
      padding: 30px;
      border-radius: 12px;
      max-width: 450px;
      margin: auto;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      text-align: left;
    }
    select, button {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
  .btn-whatsapp { background: #25D366; color: white; border: none; }
  .btn-whatsapp:hover { background: #1ebe5b; }
  .btn-messenger { background: #0084FF; color: white; border: none; }
  .btn-messenger:hover { background: #006acc; }
    h2 { color: #25D366; text-align: center; }
 .note { font-size: 13px; color: #555; margin-top: 10px; text-align: center; font-weight: bold; }
 .products { margin: 15px 0; padding: 10px; border: 1px solid #ddd; border-radius: 8px; background: #fafafa; }
 .products label { display: block; margin: 8px 0; cursor: pointer; }
  </style>
</head>
<body>
  <div class="container">
    <h2>All for Sukkur</h2>

    <!-- 1. Company -->
    <label><b>Select Company:</b></label>
    <select id="company" onchange="showProducts()">
      <option value="">-- Choose Company --</option>
      <option value="peak">Peak Frens</option>
      <option value="cookania">Cookania</option>
    </select>

    <!-- 2. Multiple Products -->
    <div id="productsBox" class="products" style="display:none;">
      <label><b>Select Products:</b></label>
      <div id="productsList"></div>
    </div>

    <!-- 3. Send Buttons -->
    <button class="btn-whatsapp" onclick="sendWhatsApp()">Send on WhatsApp</button>
    <button class="btn-messenger" onclick="sendMessenger()">Send on Messenger</button>

    <p class="note">* Serving All of Sukkur</p>
  </div>

  <script>
    // 👇 YAHAN APNE LINKS DAALO 👇
    const myWhatsApp = "923051933595"; // Tumhara WhatsApp
    const myMessenger = "https://m.me/peer.bakhsh"; // Tumhara Messenger link

    const data = {
      peak: ["Click", "Supper", "Gluko", "Mari", "Lemon", "Pinat Plus"],
      cookania: ["Peakanut", "Zeera", "Season Magic", "Coconut"]
    };

    function showProducts() {
      const company = document.getElementById("company").value;
      const productsBox = document.getElementById("productsBox");
      const productsList = document.getElementById("productsList");
      productsList.innerHTML = "";

      if (company && data[company]) {
        productsBox.style.display = "block";
        data[company].forEach(product => {
          productsList.innerHTML += `
            <label>
              <input type="checkbox" name="product" value="${product}">
              ${product}
            </label>
          `;
        });
      } else {
        productsBox.style.display = "none";
      }
    }

    function getOrderText() {
      const companySelect = document.getElementById("company");
      const company = companySelect.options[companySelect.selectedIndex].text;

      const selectedProducts = [];
      document.querySelectorAll('input[name="product"]:checked').forEach(cb => {
        selectedProducts.push(cb.value);
      });

      if (!companySelect.value) {
        alert("Pehle Company select karo");
        return null;
      }
      if (selectedProducts.length === 0) {
        alert("Kam se kam 1 Product select karo");
        return null;
      }

      return `*New Order - All for Sukkur*%0A%0ACompany: ${company}%0AProducts:%0A- ${selectedProducts.join("%0A- ")}`;
    }

    function sendWhatsApp() {
      const message = getOrderText();
      if(!message) return;
      const url = `https://wa.me/${myWhatsApp}?text=${message}`;
      window.open(url, "_blank");
    }

    function sendMessenger() {
      const message = getOrderText();
      if(!message) return;
      // Messenger link + prefilled text
      const url = `${myMessenger}?text=${decodeURIComponent(message).replace(/%0A/g, '\n')}`;
      window.open(url, "_blank
