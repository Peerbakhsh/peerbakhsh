let customerIdentity=null;

function sanitizePhone(phone){

return String(phone||"").replace(/[^0-9]/g,"");

}


async function registerCustomerIdentity(name,phone){

const id=sanitizePhone(phone);

if(!id||id.length<7){

throw new Error("Sahi WhatsApp Number likhein.");

}

if(!name){

throw new Error("Naam likhein.");

}

const existing=await dbGet("customers/"+id);

await dbSet("customers/"+id,{

name,
phone,

createdAt:
existing?.createdAt||new Date().toLocaleString("en-PK"),

createdTimestamp:
existing?.createdTimestamp||Date.now(),

updatedAt:new Date().toLocaleString("en-PK"),
updatedTimestamp:Date.now()

});

customerIdentity={
id,
name,
phone
};

return customerIdentity;

}

"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#39;"

async function dbGet(path){

const snap=await get(ref(db,path));

return snap.exists()?snap.val():null;

}

async function dbSet(path,data){

await set(ref(db,path),data);

}

async function dbUpdate(path,data){

await update(ref(db,path),data);

}

/* =========================================================
NORMALIZE
========================================================= */

function normalizeVariant(x){

return{

name:String(x?.name||""),

price:number(x?.price),

costPrice:number(
x?.costPrice!==undefined
?
x.costPrice
:
0

)

};

}


function normalizeCombination(x){

return{

flavor:String(x?.flavor||""),
weight:String(x?.weight||""),
unit:String(x?.unit||""),

price:number(x?.price),
costPrice:number(x?.costPrice),

/* stock ab HAR combination (flavor+weight+unit) ka apna,
   base unit mein rakha jata hai */
stock:number(
x?.stock!==undefined?x.stock:0
),

/* barcode — har combination ka apna, market POS jaisa */
barcode:String(x?.barcode||"")

};

}


function normalizeProduct(id,p){

const combinations=
(p.combinations||[]).map(normalizeCombination);

return{

id,

...p,

/* baseUnit sirf admin ke liye label hai
   (jaise Piece, Gram, ml wagera) */
baseUnit:String(p.baseUnit||"Piece"),

minStock:number(
p.minStock!==undefined
?
p.minStock
:
10
),

costPrice:number(p.costPrice),

price:number(p.price),

flavors:(p.flavors||[]).map(normalizeVariant),

weights:(p.weights||[]).map(normalizeVariant),

units:(p.units||[]).map(normalizeVariant),

combinations

};

}


/* combination ka total stock (sirf ADMIN dashboards ke liye) */
function productTotalStock(p){

return(p.combinations||[])
.reduce((a,c)=>a+number(c.stock),0);

}

window.productTotalStock=productTotalStock;


function comboKey(flavor,weight,unit){

return[
flavor||"",
weight||"",
unit||""
].join("|||");

}


function findCombo(p,flavor,weight,unit){

return(p.combinations||[]).find(x=>
String(x.flavor||"")===String(flavor||"") &&
String(x.weight||"")===String(weight||"") &&
String(x.unit||"")===String(unit||"")
)||null;

}

/* =========================================================
RATE ENGINE
========================================================= */

function getSelectedVariants(id){

const p=products.find(x=>x.id===id);

if(!p)return[];

const selected=getProductSelections(id);

const flavors=selected.flavors.length?selected.flavors:[""];
const weights=selected.weights.length?selected.weights:[""];
const units=selected.units.length?selected.units:[""];

const result=[];

flavors.forEach(flavor=>{

weights.forEach(weight=>{

units.forEach(unit=>{

const combo=findCombo(p,flavor,weight,unit);

let price=number(p.price);
let costPrice=number(p.costPrice);

if(combo){

price=number(combo.price);
costPrice=number(combo.costPrice);

}else{

const f=(p.flavors||[]).find(
x=>String(x.name)===String(flavor)
);

const w=(p.weights||[]).find(
x=>String(x.name)===String(weight)
);

const u=(p.units||[]).find(
x=>String(x.name)===String(unit)
);

if(f && flavor){
price=number(f.price);
costPrice=number(f.costPrice);
}

if(w && weight){
price=number(w.price);
costPrice=number(w.costPrice);
}

if(u && unit){
price=number(u.price);
costPrice=number(u.costPrice);
}

}

const key=[
flavor,
weight,
unit
].join("|||");

if(!result.some(x=>x.key===key)){

result.push({

key,
flavor,
weight,
unit,
price,
costPrice,
profitPerUnit:price-costPrice,
hasCombo:!!combo

});

}

});

});

});

return result;

}

window.getSelectedVariants=getSelectedVariants;

return getSelectedVariants(id)[0]||null;

}

/* =========================================================
CREATE ORDER
Order HAMESHA confirm hota hai — customer side par
koi stock check ya block nahi hai.
Stock sirf background mein (admin ke liye) har
combination (flavor+weight+unit) ke hisab se,
base unit mein minus hoti hai. Negative bhi ho sakta
hai — admin panel mein low/negative dikh jayega.
========================================================= */

async function createOrder(){

const name=document.getElementById("customerName").value.trim();
const phone=document.getElementById("customerPhone").value.trim();
const address=document.getElementById("customerAddress").value.trim();

if(!name||!phone){

alert("Dukaan ka naam aur phone required hai.");
return;

}


/*
TOTAL SALES
*/

const total=
cart.reduce((a,x)=>
a+number(x.qty)*number(x.price),0);


/*
TOTAL COGS
*/

const totalCost=
cart.reduce((a,x)=>
a+number(x.qty)*number(x.costPrice),0);


/*
GROSS PROFIT
*/

const totalProfit=
total-totalCost;


/*
MARGIN
*/

const margin=
total>0
?
(totalProfit/total)*100
:
0;


const billRef=push(ref(db,"bills"));
const billId=billRef.key;

const now=new Date().toLocaleString("en-PK");
const timestamp=Date.now();

const stockChanges=[];

try{

/*
BACKGROUND COMBINATION STOCK DEDUCTION
(customer ko kabhi nahi dikhaya jata, order kabhi
block nahi hota — sirf ledger record hoti hai)
*/

for(const item of cart){

if(item.request)continue;

const p=products.find(x=>x.id===item.id);

if(!p)continue;

const combos=p.combinations||[];

const idx=combos.findIndex(x=>
String(x.flavor||"")===String(item.flavor||"") &&
String(x.weight||"")===String(item.weight||"") &&
String(x.unit||"")===String(item.unit||"")
);

/* agar is exact flavor/weight/unit ka koi
combination admin ne define hi nahi kiya,
to stock track nahi hogi — sirf sale save hogi */

if(idx===-1)continue;

const stockPath=
"products/"+item.id+"/combinations/"+idx+"/stock";

const snap=await get(ref(db,stockPath));

const oldStock=
snap.exists()?number(snap.val()):0;

const newStock=oldStock-number(item.qty);

await set(ref(db,stockPath),newStock);

stockChanges.push({

productId:item.id,
productName:p.name,

flavor:item.flavor||"",
weight:item.weight||"",
unit:item.unit||"",

type:"SALE",

quantity:number(item.qty),

oldStock,
newStock,

date:now,
timestamp

});

}


/*
BILL
*/

const bill={

id:billId,

uid:customerIdentity.id,

date:now,
timestamp,

customer:{
name,
phone,
address
},

items:
JSON.parse(JSON.stringify(cart)),

total,

totalCost,

profit:totalProfit,

profitMargin:margin,

paid:0,

balance:total,

stockChanges,

history:[{

date:now,
timestamp,

type:"Order",

jama:0,

balance:total

}]

};


await set(billRef,bill);


/*
PROFIT LEDGER
*/

const profitRef=push(ref(db,"profitLedger"));

await set(profitRef,{

billId,

uid:customerIdentity.id,

date:now,
timestamp,

sales:total,

cost:totalCost,

profit:totalProfit,

margin

});


/*
MASTER STOCK LEDGER (per combination)
*/

for(const change of stockChanges){

const r=push(ref(db,"stockLedger"));

await set(r,{

productId:change.productId,

productName:change.productName,

flavor:change.flavor,
weight:change.weight,
unit:change.unit,

type:"SALE",

quantity:change.quantity,

oldStock:change.oldStock,

newStock:change.newStock,

billId,

uid:customerIdentity.id,

date:now,

timestamp

});

}


/*
CLEAR CART
*/

cart=[];

updateCart();

closeAll();

renderBill(bill);

document
.getElementById("billModal")
.classList.add("show");

showStatus(
"✅ Order Confirm ho gaya"
);

await loadProducts();

}catch(e){

console.error(e);

alert(
"Order save nahi hua:\n"+
e.message
);

}

}

window.createOrder=createOrder;

/* =========================================================
DATE HELPERS
========================================================= */

function startOfDay(){

const d=new Date();

d.setHours(0,0,0,0);

return d.getTime();

}

function startOfWeek(){

const d=new Date();

const day=d.getDay();

const diff=day===0?-6:1-day;

d.setDate(d.getDate()+diff);

d.setHours(0,0,0,0);

return d.getTime();

}

function startOfMonth(){

const d=new Date();

d.setDate(1);

d.setHours(0,0,0,0);

return d.getTime();

}

function startOfYear(){

const d=new Date();

d.setMonth(0,1);

d.setHours(0,0,0,0);

return d.getTime();

}


function calculateSums(list){

const sales=list.reduce(
(a,x)=>a+number(x.sales),0
);

const cost=list.reduce(
(a,x)=>a+number(x.cost),0
);

const profit=list.reduce(
(a,x)=>a+number(x.profit),0
);

const margin=
sales>0
?
(profit/sales)*100
:
0;

return{
sales,
cost,
profit,
margin
};

}

async function saveStockPurchase(id,idx){

const p=products.find(x=>x.id===id);

if(!p)return;

const c=(p.combinations||[])[idx];

if(!c)return;

const qty=
number(document.getElementById("purchaseQty").value);

const baseCost=
number(document.getElementById("purchaseCost").value);

const extraExpense=
number(document.getElementById("purchaseExtraExpense").value);

const supplier=
document.getElementById("purchaseSupplier").value.trim();

const note=
document.getElementById("purchaseNote").value.trim();

if(qty<=0){

alert("Quantity 0 se zyada honi chahiye.");
return;

}

if(baseCost<0||extraExpense<0){

alert("Cost invalid hai.");
return;

}

/*
Extra Expense (jaise Transport/Freight) is poori
purchase ki quantity mein equally divide hoke
Purchase Cost Per Unit mein shamil ho jati hai —
taake Gross Profit automatically sahi nikle,
chahe aap Carton bechein ya Packet.
*/

const perUnitExtra=
qty>0?(extraExpense/qty):0;

const cost=
baseCost+perUnitExtra;

const stockPath="products/"+id+"/combinations/"+idx+"/stock";
const costPath="products/"+id+"/combinations/"+idx+"/costPrice";

const oldStock=number(await dbGet(stockPath));

const newStock=oldStock+qty;


/*
Weighted Average Cost (per combination)
*/

const oldCost=number(c.costPrice);

const totalOldValue=oldStock*oldCost;
const totalNewValue=qty*cost;

const averageCost=
newStock>0
?
(totalOldValue+totalNewValue)/newStock
:
cost;


await dbSet(stockPath,newStock);

await dbSet(
costPath,
Number(averageCost.toFixed(2))
);


/*
STOCK LEDGER
*/

const r=push(ref(db,"stockLedger"));

await set(r,{

productId:id,
productName:p.name,

flavor:c.flavor||"",
weight:c.weight||"",
unit:c.unit||"",

type:"PURCHASE",

quantity:qty,

baseCost,

extraExpense,

purchaseCost:cost,

oldStock,
newStock,

oldCost,
newCost:averageCost,

supplier,
note,

date:new Date().toLocaleString("en-PK"),
timestamp:Date.now(),

uid:firebaseUser.uid

});


closeModal();

await loadProducts();

adminStock();

showStatus(
"✅ Stock IN + Average Cost update ho gaya"
);

}

window.saveStockPurchase=saveStockPurchase;

async function saveProduct(id){

const data={

name:
document.getElementById("epName").value.trim(),

icon:
document.getElementById("epIcon").value.trim()||"📦",

price:
number(document.getElementById("epPrice").value),

costPrice:

minStock:
number(document.getElementById("epMinStock").value),

shortInfo:
document.getElementById("epShort").value.trim(),

info:
document.getElementById("epInfo").value.trim(),

active:
document.getElementById("epActive").checked,

flavors:
collectVariantRows("flavorList"),

weights:
collectVariantRows("weightList"),

units:
collectVariantRows("unitList"),

combinations:
collectCombinations()

};

const removeImage=
document.getElementById("epRemoveImage").checked;

const file=
document.getElementById("epImage").files[0];

try{

if(removeImage){

data.image="";

}else if(file){

if(file.size>8*1024*1024){

alert("Image 8MB se choti honi chahiye.");
return;

}

const r=
storageRef(
storage,
"products/"+id+"_"+Date.now()
);

await uploadBytes(r,file);

data.image=await getDownloadURL(r);

}else{

data.image=p.image||"";

}

await dbUpdate("products/"+id,data);

await loadProducts();
await adminProducts();

showStatus(
"✅ Product + Picture + Stock + Cost save ho gaya"
);

}catch(e){

alert("Product save error:\n"+e.message);

}

}

async function saveBillEdit(id){

const b=await dbGet("bills/"+id);

if(!b)return;


(b.items||[]).forEach((x,i)=>{

const q=document.getElementById("billQty"+i);
const r=document.getElementById("billRate"+i);
const c=document.getElementById("billCost"+i);

if(q)x.qty=number(q.value)||1;

if(r)x.price=number(r.value);

if(c)x.costPrice=number(c.value);

});


b.total=
(b.items||[])
.reduce(
(a,x)=>a+number(x.qty)*number(x.price),
0
);

b.totalCost=
(b.items||[])
.reduce(
(a,x)=>a+number(x.qty)*number(x.costPrice),
0
);

b.profit=
b.total-b.totalCost;

b.profitMargin=
b.total>0
?
(b.profit/b.total)*100
:
0;


const payment=
number(
document.getElementById("paymentAmount").value
);

const note=
document.getElementById("paymentNote")
.value.trim()||"Jama";

if(payment>0){

b.paid=number(b.paid)+payment;

if(!b.history)b.history=[];

b.history.push({

date:new Date().toLocaleString("en-PK"),
timestamp:Date.now(),

type:note,

jama:payment,

balance:
Math.max(0,b.total-b.paid)

});

}

b.balance=
Math.max(
0,
b.total-b.paid
);


await dbSet("bills/"+id,b);


const ledger=await getProfitLedger();

for(const x of ledger){

if(x.billId===id){

await dbUpdate(
"profitLedger/"+x.id,
{

sales:b.total,

cost:b.totalCost,

profit:b.profit,

margin:b.profitMargin

}
);

}

}

alert(
"✅ Bill update ho gaya.\n"+
"✅ COGS update ho gaya.\n"+
"✅ Profit dobara calculate ho gaya.\n"+
"✅ Khata update ho gaya."
);

adminBills();

}

/* =========================================================
BARCODE SYSTEM
(Har Flavor/Weight/Unit combination ka apna barcode —
scan karke turant cart mein add kiya ja sakta hai,
aur print ke liye barcode label bhi generate hoti hai)
========================================================= */

function ensureCombinationBarcodes(p){

let changed=false;

(p.combinations||[]).forEach((c,idx)=>{

if(!c.barcode){

c.barcode=
"PB"+
String(p.id||"").replace(/[^A-Za-z0-9]/g,"").slice(-4).toUpperCase()+
String(idx).padStart(2,"0")+
String(Date.now()).slice(-4);

changed=true;

}

});

return changed;

}


function findComboByBarcode(barcode){

const code=String(barcode||"").trim();

if(!code)return null;

for(const p of products){

const idx=(p.combinations||[]).findIndex(
c=>String(c.barcode||"")===code
);

if(idx!==-1){

return{
product:p,
combo:p.combinations[idx],
idx
};

}

}

return null;

}

window.findComboByBarcode=findComboByBarcode;


function scanBarcodeAdd(inputId){

const input=document.getElementById(inputId||"barcodeScanInput");

if(!input)return;

const code=input.value.trim();

input.value="";

if(!code)return;

const found=findComboByBarcode(code);

if(!found){

showStatus("❌ Barcode se koi product nahi mila");

return;

}

const{product,combo}=found;

const old=cart.find(x=>

x.id===product.id &&
x.request!==true &&
String(x.flavor||"")===String(combo.flavor||"") &&
String(x.weight||"")===String(combo.weight||"") &&
String(x.unit||"")===String(combo.unit||"")

);

if(old){

old.qty+=1;
old.price=combo.price;
old.costPrice=combo.costPrice;

}else{

cart.push({

id:product.id,
name:product.name,
icon:product.icon,
image:product.image||"",

flavor:combo.flavor,
weight:combo.weight,
unit:combo.unit,

price:combo.price,
costPrice:combo.costPrice,

qty:1,

request:false

});

}

updateCart();

showStatus(
"🔖 "+product.name+" Barcode se Cart mein add ho gaya"
);

}

window.scanBarcodeAdd=scanBarcodeAdd;

});

html+=`

➤

🎤

🖼️

<input
class="chatFile"

accept="image/*"
onchange="sendChatImage()">

</label>

</div>

`;

async function sendTextChat(){

const input=document.getElementById("chatText");

if(!input)return;

const text=input.value.trim();

if(!text)return;

const r=
push(
ref(
db,
"chats/"+currentChatCustomer
)
);

await set(r,{

from:currentChatRole,

type:"text",

text,

date:new Date().toLocaleString("en-PK"),

time:Date.now(),

read:false

});

openChat(
currentChatCustomer,
currentChatRole==="admin"?"Dukandar":"Admin",
currentChatRole
);

}

window.sendTextChat=sendTextChat;


async function sendChatImage(){

const file=
document.getElementById("chatImage")
.files[0];

if(!file)return;

if(file.size>8*1024*1024){

alert("Image 8MB se choti honi chahiye.");
return;

}

try{

const r=
storageRef(
storage,
"chat/"+currentChatCustomer+
"/img_"+Date.now()
);

await uploadBytes(r,file);

const url=await getDownloadURL(r);

const msg=
push(
ref(
db,
"chats/"+currentChatCustomer
)
);

await set(msg,{

from:currentChatRole,

type:"image",

data:url,

date:new Date().toLocaleString("en-PK"),

time:Date.now(),

read:false

});

openChat(
currentChatCustomer,
currentChatRole==="admin"?"Dukandar":"Admin",
currentChatRole
);

}catch(e){

alert("Image upload error:\n"+e.message);

}

}

window.sendChatImage=sendChatImage;


async function startVoice(){

if(
recorder &&
recorder.state==="recording"
){

recorder.stop();
return;

}

try{

const stream=
await navigator.mediaDevices.getUserMedia({
audio:true
});

voiceChunks=[];

recorder=new MediaRecorder(stream);

recorder.ondataavailable=e=>{

if(e.data.size)
voiceChunks.push(e.data);

};

recorder.onstop=async()=>{

const blob=
new Blob(
voiceChunks,
{
type:"audio/webm"
}
);

try{

const r=
storageRef(
storage,
"chat/"+currentChatCustomer+
"/voice_"+Date.now()+
".webm"
);

await uploadBytes(r,blob);

const url=await getDownloadURL(r);

const msg=
push(
ref(
db,
"chats/"+currentChatCustomer
)
);

await set(msg,{

from:currentChatRole,

type:"voice",

data:url,

date:new Date().toLocaleString("en-PK"),

time:Date.now(),

read:false

});

openChat(
currentChatCustomer,
currentChatRole==="admin"?"Dukandar":"Admin",
currentChatRole
);

}catch(e){

alert("Voice upload error:\n"+e.message);

}

stream.getTracks().forEach(x=>x.stop());

};

recorder.start();

showStatus(
"🎤 Recording start — dobara button dabayein stop ke liye"
);

}catch(e){

alert(
"Microphone permission allow karein.\n\n"+
e.message
);

}

}

window.startVoice=startVoice;
