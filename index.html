<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sukkur Company Products Order</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      padding: 40px;
      text-align: center;
    }
  .container {
      background: white;
      padding: 30px;
      border-radius: 12px;
      max-width: 450px;
      margin: auto;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      text-align: left;
    }
    select, button {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 16px;
    }
    button {
      background: #25D366;
      color: white;
      border: none;
      cursor: pointer;
      font-weight: bold;
    }
    button:hover { background: #1ebe5b; }
    h2 { color: #333; text-align: center; }
  .note { font-size: 12px; color: red; margin-top: 10px; text-align: center; }
  .products {
      margin: 15px 0;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 8px;
      background: #fafafa;
    }
  .products label {
      display: block;
      margin: 8px 0;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Sukkur Delivery Only</h2>

    <!-- 1. Company -->
    <label><b>Select Company:</b></label>
    <select id="company" onchange="showProducts()">
      <option value="">-- Choose Company --</option>
      <option value="peak">Peak Frens</option>
      <option value="cookania">Cookania</option>
    </select>

    <!-- 2. Multiple Products with Checkbox -->
    <div id="productsBox" class="products" style="display:none;">
      <label><b>Select Products:</b></label>
      <div id="productsList"></div>
    </div>

    <!-- 3. Send Button -->
    <button onclick="sendWhatsApp()">Send Order on WhatsApp</button>

    <p class="note">* Delivery only in Sukkur City</p>
  </div>

  <script>
    // Tumhara WhatsApp number: 03051933595 → 923051933595
    const myWhatsApp = "923051933595";

    const data = {
      peak: ["Click", "Supper", "Gluko", "Mari", "Lemon", "Pinat Plus"],
      cookania: ["Peakanut", "Zeera", "Season Magic", "Coconut"]
    };

    function showProducts() {
      const company = document.getElementById("company").value;
      const productsBox = document.getElementById("productsBox");
      const productsList = document.getElementById("productsList");
      productsList.innerHTML = "";

      if (company && data[company]) {
        productsBox.style.display = "block";
        data[company].forEach(product => {
          productsList.innerHTML += `
            <label>
              <input type="checkbox" name="product" value="${product}">
              ${product}
            </label>
          `;
        });
      } else {
        productsBox.style.display = "none";
      }
    }

    function sendWhatsApp() {
      const companySelect = document.getElementById("company");
      const company = companySelect.options[companySelect.selectedIndex].text;

      // jitne checkbox tick hain sab le lo
      const selectedProducts = [];
      document.querySelectorAll('input[name="product"]:checked').forEach(cb => {
        selectedProducts.push(cb.value);
      });

      if (!companySelect.value) {
        alert("Pehle Company select karo");
        return;
      }
      if (selectedProducts.length === 0) {
        alert("Kam se kam 1 Product select karo");
        return;
      }

      const message = `*New Order - Sukkur*%0A%0ACompany: ${company}%0AProducts:%0A- ${selectedProducts.join("%0A- ")}%0A%0A*Delivery City: Sukkur*`;
      const url = `https://wa.me/${myWhatsApp}?text=${message}`;
      window.open(url, "_blank");
    }
  </script>
</body>
</html>
