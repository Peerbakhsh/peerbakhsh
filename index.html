<!DOCTYPE html><html lang="ur"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Peerbakhsh Wholesale</title><style> *{box-sizing:border-box} body{margin:0;font-family:'Segoe UI',Arial;background:#f1f8e9} header{background:#075e54;color:white;text-align:center;padding:18px;font-size:22px;font-weight:bold;position:sticky;top:0}.tabs{display:flex;background:white;position:sticky;top:61px;z-index:9}.tab{flex:1;padding:14px;color:#075e54;text-align:center;cursor:pointer;font-weight:bold}.tab.active{background:#25D366;color:white}.box{background:white;margin:15px;padding:18px;border-radius:15px;box-shadow:0 4px 15px rgba(0,0,0,.1)}.hidden{display:none} input,select{width:100%;padding:12px;margin:6px 0;border:2px solid #c8e6c9;border-radius:10px} button{padding:14px;border:none;border-radius:10px;color:white;font-weight:bold;cursor:pointer;width:100%;margin-top:8px}.btn-green{background:#25D366}.btn-red{background:#d32f2f}.btn-blue{background:#1976d2}.btn-gray{background:#555}.cart-item{display:flex;justify-content:space-between;padding:8px;border-bottom:1px dashed #ddd}.khata-table{width:100%;border-collapse:collapse;font-size:14px}.khata-table th{background:#075e54;color:white;padding:10px}.khata-table td{padding:8px;text-align:center;border-bottom:1px solid #ddd}.total{font-weight:bold;font-size:18px;text-align:center;background:#bbdefb;padding:14px;border-radius:10px;color:#075e54}.bill-head{text-align:center;border-bottom:2px dashed #000;padding-bottom:10px} @media print{.tabs,header,button{display:none}} </style></head><body><header>🏪 Peerbakhsh Wholesale</header><div class="tabs"><div class="tab active" onclick="openTab('order')">🛒 Order</div><div class="tab" onclick="openTab('khata')">📒 Mera Khata</div><div class="tab admin-tab hidden" onclick="openTab('admin')">👑 Admin</div></div>

<div id="order">
<div class="box"><h3>Dukan Ki Maloomat</h3><input id="shopName" placeholder="Dukan Ka Naam"><input id="shopAddress" placeholder="Address"><input id="custName" placeholder="Aap Ka Naam"></div>
<div id="list"></div>
<div class="box"><h3>🛒 Cart</h3><div id="cartItems">Khali Hai</div><p class="total">Total: Rs.<span id="cartTotal">0</span></p><button class="btn-gray" onclick="clearCart()">🗑️ Cart Khali Karo</button><button class="btn-green" onclick="genBill()">🧾 Bill Preview</button></div>
<div id="billPreview" class="box hidden"></div>
</div>

<div id="khata" class="hidden">
<div class="box"><h3>📒 <span id="kNameShow">-</span> Ka Khata</h3><p class="total">Baqi: Rs.<span id="kBaqi">0</span></p><table class="khata-table"><thead><tr><th>Date</th><th>Detail</th><th>Jama</th><th>Baqi</th></tr></thead><tbody id="kHistory"></tbody></table><button class="btn-blue" onclick="window.print()">🖨️ Print Khata</button></div>
</div>

<div id="admin" class="hidden">
<div class="box"><h3>👑 Admin Panel</h3><select id="adminCust" onchange="loadAdminKhata()"><option value="">Customer Select Karo</option></select><h4>Khata Update</h4><input id="kJama" type="number" placeholder="Jama Rqam"><button class="btn-green" onclick="addJama()">💰 Jama Add Karo</button><hr><h4>Admin Controls</h4><button class="btn-blue" onclick="saveData()">💾 Save</button><button class="btn-gray" onclick="loadData()">🔄 Reload</button><button class="btn-blue" onclick="window.print()">🖨️ Print Preview</button><button class="btn-green" onclick="whatsAppKhata()">📲 WhatsApp</button><button class="btn-red" onclick="deleteAll()">❌ Khatam Karo</button><hr><table class="khata-table"><thead><tr><th>Date</th><th>Detail</th><th>Jama</th><th>Baqi</th></tr></thead><tbody id="adminHistory"></tbody></table><p class="total">Baqi: Rs.<span id="adminBaqi">0</span></p></div>
</div>

<script>
let cart=[],DATA={},IS_ADMIN=false;
const PRODUCTS=[{id:1,name:"Pika Nut",rate:2880},{id:2,name:"Zeera",rate:2880},{id:3,name:"Season",rate:2880}];
const urlParams = new URLSearchParams(window.location.search);
if(urlParams.get('admin') === '1234'){IS_ADMIN = true;document.querySelector('.admin-tab').classList.remove('hidden');}

function openTab(x){document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));document.querySelectorAll('#order,#khata,#admin').forEach(d=>d.classList.add('hidden'));document.getElementById(x).classList.remove('hidden');event.target.classList.add('active');if(x=='khata')showKhata();if(x=='admin')loadCustomers();}

function loadPage(){let html="";PRODUCTS.forEach(p=>{html+=`<div class=box><h3>${p.name}</h3><p>Rate: Rs.${p.rate} per Carton</p><input type=number id=qty${p.id} value=1 placeholder=Qty><button class=btn-green onclick="addToCart(${p.id})">Cart Me Add</button></div>`});document.getElementById("list").innerHTML=html;}
function addToCart(id){let p=PRODUCTS.find(x=>x.id==id);let q=parseInt(document.getElementById("qty"+id).value)||1;cart.push({id:id,n:p.name,q:q,rate:p.rate});updateCart();}
function updateCart(){let t=cart.reduce((a,b)=>a+b.rate*b.q,0);document.getElementById("cartItems").innerHTML=cart.map((x,i)=>`<div class=cart-item><span>${x.n} x ${x.q}</span><span>Rs.${x.rate*x.q} <button style="width:30px;padding:2px" class=btn-red onclick="delItem(${i})">X</button></span></div>`).join("")||"Khali Hai";document.getElementById("cartTotal").innerText=t;}
function delItem(i){if(confirm("Pakka delete karna hai?")){cart.splice(i,1);updateCart();}}
function clearCart(){if(confirm("Pura cart khali karna hai?")){cart=[];updateCart();}}

function genBill(){let sn=document.getElementById("shopName").value; let sa=document.getElementById("shopAddress").value; let cn=document.getElementById("custName").value; if(!sn||!cn){alert("Pehle Dukan Naam aur Aap ka Naam likho");return;} let date=new Date().toLocaleString(); let items=cart.map(x=>`<tr><td>${x.n}</td><td>${x.q}</td><td>${x.rate}</td><td>${x.rate*x.q}</td></tr>`).join(""); let total=document.getElementById("cartTotal").innerText; document.getElementById("billPreview").innerHTML=`<div class=bill-head><h2>${sn}</h2><p>${sa}</p><p>Customer: ${cn}</p><p>${date}</p></div><table width=100%><tr><th>Item</th><th>Qty</th><th>Rate</th><th>Total</th></tr>${items}</table><p class=total>Bill Total: Rs.${total}</p><button class=btn-blue onclick="window.print()">🖨️ Print</button>`; document.getElementById("billPreview").classList.remove("hidden"); saveOrder(sn,sa,cn,total,date);}
function saveOrder(sn,sa,cn,total,date){if(!DATA[cn])DATA[cn]=[]; DATA[cn].push({date:date,type:"Order",detail:sn,amount:total,baqi:(DATA[cn].length>0?DATA[cn][DATA[cn].length-1].baqi:0)+parseInt(total)}); saveData();}

function showKhata(){let n=document.getElementById("custName").value; document.getElementById("kNameShow").innerText=n; loadKhata(n,"kHistory","kBaqi");}
function loadAdminKhata(){let n=document.getElementById("adminCust").value; loadKhata(n,"adminHistory","adminBaqi");}
function loadKhata(n,tb,baqi){let d=DATA[n]||[]; document.getElementById(tb).innerHTML=d.map(x=>`<tr><td>${x.date}</td><td>${x.detail}</td><td>${x.type=="Jama"?x.amount:""}</td><td>${x.baqi}</td></tr>`).join(""); document.getElementById(baqi).innerText=d.length>0?d[d.length-1].baqi:0;}

function loadCustomers(){let sel=document.getElementById("adminCust"); sel.innerHTML='<option value="">Customer Select Karo</option>'+Object.keys(DATA).map(k=>`<option>${k}</option>`).join("");}
function addJama(){let n=document.getElementById("adminCust").value; let j=parseInt(document.getElementById("kJama").value); if(!n||!j)return; if(!DATA[n])DATA[n]=[]; let lastBaqi=DATA[n].length>0?DATA[n][DATA[n].length-1].baqi:0; DATA[n].push({date:new Date().toLocaleString(),type:"Jama",detail:"Jama",amount:j,baqi:lastBaqi-j}); saveData(); loadAdminKhata(); alert("Jama Add ho gaya");}
function saveData(){localStorage.setItem("khataDataV2",JSON.stringify(DATA)); alert("Save ho gaya");}
function loadData(){DATA=JSON.parse(localStorage.getItem("khataDataV2")||"{}"); alert("Reload ho gaya");}
function deleteAll(){let c=0; if(confirm("Pakka Khatam karna hai?"))c++; if(confirm("Aakhri bar soch lo?"))c++; if(confirm("Data delete ho jayega!"))c++; if(c==3){localStorage.removeItem("khataDataV2"); DATA={}; loadCustomers(); alert("Sab Khatam");}}
function whatsAppKhata(){let n=document.getElementById("adminCust").value; let baqi=document.getElementById("adminBaqi").innerText; let msg=`Assalamualaikum ${n}\nAap ka Baqi: Rs.${baqi}`; window.open(`https://wa.me/?text=${encodeURIComponent(msg)}`);}

document.addEventListener("DOMContentLoaded",()=>{loadData();loadPage();});
</script></body></html>
